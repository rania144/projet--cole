version: '3.8'

networks:
  monitoring:
    driver: bridge

services:
  web:
    build: .
    ports:
      - "8080:80"
    networks:
      - monitoring

  db:
    image: mariadb:latest
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: greenshop
      MYSQL_USER: greenshop_user
      MYSQL_PASSWORD: your_secure_password
    ports:
      - "3306:3306"
    volumes:
      - ./dump:/docker-entrypoint-initdb.d
    networks:
      - monitoring

  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    environment:
      DATA_SOURCE_NAME: "greenshop_user:your_secure_password@(db:3306)/"
    depends_on:
      - db
    ports:
      - "9104:9104"
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus:/etc/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    depends_on:
      - cadvisor
      - blackbox
      - mysqld-exporter
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    networks:
      - monitoring

  blackbox:
    image: prom/blackbox-exporter:latest
    ports:
      - "9115:9115"
    networks:
      - monitoring

  cadvisor:
  image: gcr.io/cadvisor/cadvisor:latest   # Image officielle cAdvisor
  volumes:
    - /:/rootfs:ro             # Accès en lecture seule au système
    - /var/run:/var/run:ro     # Accès aux sockets système
    - /sys:/sys:ro             # Accès aux infos du kernel
    - /var/lib/docker/:/var/lib/docker:ro   # Accès aux conteneurs Docker
  ports:
    - "8081:8080"   # Expose le port 8081 (interface web cAdvisor)
  networks:
    - monitoring    # Fait partie du réseau "monitoring"

    ports:
      - "8081:8080"
    networks:
      - monitoring


